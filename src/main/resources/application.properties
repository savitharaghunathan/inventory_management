# Application Name
spring.application.name=Inventory Management

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.example.inventorymanagement=INFO
logging.level.com.enterprise.audit.logging=INFO

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Audit Configuration (Environment Variables)
# AUDIT_STREAM_HOST=localhost
# AUDIT_STREAM_PORT=5000
# AUDIT_STREAM_PROTOCOL=tcp 